<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" role="img" aria-label="MONEYPRO">
  <!-- circular emblem with stylised M / mountain mark -->
  <g transform="translate(45 45)">
    <circle r="40" fill="#b00d0d"/>
    <circle r="33" fill="none" stroke="#ffffff" stroke-width="3"/>
    <!-- white mountain "M": two overlapping triangular peaks -->
    <path d="M-19 16 L-6 -14 L1 2 L-6 2 L-11 16 Z" fill="#ffffff"/>
    <path d="M19 16 L6 -14 L-1 2 L6 2 L11 16 Z" fill="#ffffff"/>
    <path d="M-6 -14 L6 -14 L0 0 Z" fill="#ffffff"/>
  </g>
  <!-- MONEYPRO wordmark -->
  <text x="98" y="62" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="800" font-style="italic" letter-spacing="-1" fill="#b00d0d">MONEYPRO</text>
</svg>
