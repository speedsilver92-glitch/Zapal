    <circle cx="24" cy="74" r="4.6"/>
    <circle cx="34" cy="96" r="4.6"/>
  </g>
  <!-- back layer of the bolt -->
  <path d="M108 16 L60 74 L88 74 L66 132 L128 60 L100 60 Z" fill="url(#zapalBoltBack)" opacity="0.55"/>
  <!-- main bolt -->
  <path d="M120 14 L66 78 L96 78 L74 136 L142 62 L110 62 Z" fill="url(#zapalBolt)"/>
  <!-- wordmark -->
  <text x="166" y="102" font-family="Manrope, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="2" fill="url(#zapalWord)">ZAPAL</text>
