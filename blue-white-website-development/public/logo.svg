    </linearGradient>
  </defs>
  <!-- circuit traces -->
  <g stroke="#2f6ff0" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M52 52 H30 M30 52 V70"/>
    <path d="M46 74 H24"/>
