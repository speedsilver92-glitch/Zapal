<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" fill="none" role="img" aria-label="ZAPAL">
  <defs>
    <linearGradient id="zapalBolt" x1="30" y1="18" x2="150" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22b3e6"/>
      <stop offset="0.42" stop-color="#2f6ff0"/>
      <stop offset="0.72" stop-color="#f0693a"/>
      <stop offset="1" stop-color="#f7b733"/>
    </linearGradient>
    <linearGradient id="zapalBoltBack" x1="40" y1="20" x2="120" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ad0f0"/>
      <stop offset="1" stop-color="#2f6ff0"/>
    </linearGradient>
    <linearGradient id="zapalWord" x1="180" y1="40" x2="180" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f7bf0"/>
